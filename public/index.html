<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 30px; text-align: center; border-bottom: 1px solid #333; }
        .header h1 { font-size: 2rem; color: #fff; }
        .header p { color: #888; margin-top: 5px; }
        .totales { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 30px; background: #111; }
        .total-card { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 15px; padding: 25px; text-align: center; border: 1px solid #333; }
        .total-card .numero { font-size: 2.5rem; font-weight: bold; color: #00d4ff; }
        .total-card .label { color: #888; margin-top: 5px; font-size: 0.9rem; }
        .canales { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; padding: 30px; }
        .canal-card { background: #1a1a1a; border-radius: 15px; padding: 25px; border: 1px solid #333; transition: transform 0.2s; }
        .canal-card:hover { transform: translateY(-3px); border-color: #555; }
        .canal-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .canal-emoji { font-size: 2rem; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #222; }
        .canal-nombre { font-size: 1.1rem; font-weight: bold; }
        .canal-status { font-size: 0.75rem; color: #4CAF50; margin-top: 3px; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .metric { background: #222; border-radius: 10px; padding: 12px; text-align: center; }
        .metric .valor { font-size: 1.3rem; font-weight: bold; }
        .metric .mlabel { font-size: 0.7rem; color: #888; margin-top: 3px; }
        .progress-section { margin-top: 15px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        .progress-bar { background: #333; border-radius: 10px; height: 8px; margin-bottom: 10px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 10px; transition: width 1s ease; }
        .btn-canal { display: block; text-align: center; padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: bold; text-decoration: none; transition: opacity 0.2s; }
        .btn-canal:hover { opacity: 0.8; }
        .loading { text-align: center; padding: 50px; color: #888; font-size: 1.2rem; }
        .refresh-btn { position: fixed; bottom: 30px; right: 30px; background: #00d4ff; color: #000; border: none; border-radius: 50px; padding: 15px 25px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .last-update { text-align: center; color: #555; font-size: 0.8rem; padding: 10px; }
    </style>
</head>
<body>
<div class="header">
    <h1>📺 YouTube Dashboard</h1>
    <p>Panel de control — 9 canales en tiempo real</p>
</div>
<div class="totales">
    <div class="total-card"><div class="numero" id="total-subs">--</div><div class="label">🔔 Suscriptores Totales</div></div>
    <div class="total-card"><div class="numero" id="total-vistas">--</div><div class="label">👁️ Vistas Totales</div></div>
    <div class="total-card"><div class="numero" id="total-videos">--</div><div class="label">🎬 Videos Publicados</div></div>
</div>
<div id="canales" class="canales"><div class="loading">⏳ Cargando...</div></div>
<div class="last-update" id="last-update"></div>
<button class="refresh-btn" onclick="cargarDatos()">🔄 Actualizar</button>

<script>
const API_KEY = "AIzaSyBkOvvnGV2v_sCIpCFcZA6lGHBLglrDS2I";

const CANALES = [
    { nombre: "Fit Tips Latino",      id: "UCtCF9WMqwa5vCjgLNyx5zaw", color: "#FF6B6B", emoji: "💪" },
    { nombre: "Un Cafe con el Mundo", id: "UCbRqsnb4vOGQtEW5JDtDE6Q", color: "#4ECDC4", emoji: "☕" },
    { nombre: "Como Hacer Dinero",    id: "UCbebqeZeD8WdSZypfxb7Tnw", color: "#45B7D1", emoji: "💰" },
    { nombre: "Finanzas Sin Limites", id: "UC7uB3kv6xkRnzBqOuYK0rVQ", color: "#96CEB4", emoji: "📈" },
    { nombre: "Dinero Sin Mentiras",  id: "UCT1irBNP1JR5O0UD1gcfbOA", color: "#FFEAA7", emoji: "🔥" },
    { nombre: "Mente Digital",        id: "UCMeGTxwHiUHZV7F6fFS12Qw", color: "#DDA0DD", emoji: "🧠" },
    { nombre: "Invierte y Liberate",  id: "UCVdxFnplEkh8rs_L9GSCFaw", color: "#F7DC6F", emoji: "💎" },
    { nombre: "Secretos de Salud",    id: "UCz6JMCRoZTqZNTAPRd7alDQ", color: "#82E0AA", emoji: "🥗" },
    { nombre: "Come Muevete y Sana",  id: "UCN8GZhEYvJXdIkXpoBLfY4w", color: "#F1948A", emoji: "🏃" },
];

function fmt(n) {
    if (!n || n === '0') return '0';
    n = parseInt(n);
    if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
    if (n >= 1000) return (n/1000).toFixed(1)+'K';
    return n.toString();
}
function pct(v, m) { return !v ? '0.0' : Math.min((parseInt(v)/m)*100, 100).toFixed(1); }

async function fetchCanalStats(canal) {
    const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${canal.id}&key=${API_KEY}`;
    const r = await fetch(url);
    const d = await r.json();
    const stats = d.items?.[0]?.statistics || {};
    return {
        ...canal,
        suscriptores: parseInt(stats.subscriberCount || 0),
        vistas: parseInt(stats.viewCount || 0),
        videos: parseInt(stats.videoCount || 0),
    };
}

async function cargarDatos() {
    document.getElementById('canales').innerHTML = '<div class="loading">⏳ Actualizando...</div>';
    try {
        const resultados = await Promise.all(CANALES.map(fetchCanalStats));
        const totalSubs   = resultados.reduce((s, c) => s + c.suscriptores, 0);
        const totalVistas = resultados.reduce((s, c) => s + c.vistas, 0);
        const totalVideos = resultados.reduce((s, c) => s + c.videos, 0);
        document.getElementById('total-subs').textContent   = fmt(totalSubs);
        document.getElementById('total-vistas').textContent = fmt(totalVistas);
        document.getElementById('total-videos').textContent = fmt(totalVideos);
        document.getElementById('canales').innerHTML = resultados.map(c => `
            <div class="canal-card" style="border-top:3px solid ${c.color}">
                <div class="canal-header">
                    <div class="canal-emoji">${c.emoji}</div>
                    <div>
                        <div class="canal-nombre">${c.nombre}</div>
                        <div class="canal-status">● Activo — 4 videos/día</div>
                    </div>
                </div>
                <div class="metrics">
                    <div class="metric"><div class="valor" style="color:${c.color}">${fmt(c.suscriptores)}</div><div class="mlabel">Suscriptores</div></div>
                    <div class="metric"><div class="valor" style="color:${c.color}">${fmt(c.vistas)}</div><div class="mlabel">Vistas</div></div>
                    <div class="metric"><div class="valor" style="color:${c.color}">${c.videos}</div><div class="mlabel">Videos</div></div>
                </div>
                <div class="progress-section">
                    <div class="progress-label"><span>🔔 Subs meta</span><span>${c.suscriptores}/1,000 (${pct(c.suscriptores, 1000)}%)</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${pct(c.suscriptores, 1000)}%;background:${c.color}"></div></div>
                    <div class="progress-label"><span>⏱️ Horas visualización</span><span>${fmt(c.vistas)}/400K</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${pct(c.vistas, 400000)}%;background:${c.color}"></div></div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;">
                    <a href="https://www.youtube.com/channel/${c.id}" target="_blank" class="btn-canal" style="background:${c.color};color:#000;">
                        📺 Ver Canal
                    </a>
                    <a href="https://studio.youtube.com/channel/${c.id}" target="_blank" class="btn-canal" style="background:#222;color:#fff;border:1px solid ${c.color};">
                        🎬 YouTube Studio
                    </a>
                </div>
            </div>
        `).join('');
        document.getElementById('last-update').textContent = '🕐 ' + new Date().toLocaleString('es-DO');
    } catch(e) {
        document.getElementById('canales').innerHTML = '<div class="loading">❌ Error: ' + e.message + '</div>';
    }
}

cargarDatos();
setInterval(cargarDatos, 300000);
</script>
</body>
</html>
